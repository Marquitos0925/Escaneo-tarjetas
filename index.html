
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escanear Tarjeta</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #status {
      margin-top: 20px;
      font-size: 1.2rem;
      color: green;
    }
  </style>
</head>
<body>
  <h1>Escanear Tarjeta</h1>
  <div id="reader"></div>
  <div id="status">Esperando escaneo...</div>

  <script>
    let processing = false;

    function onScanSuccess(decodedText) {
      if (processing) return;
      processing = true;

      const params = new URLSearchParams(decodedText.split('?')[1]);
      const tarjeta = params.get("tarjeta");

      if (tarjeta) {
        document.getElementById("status").innerText = `Registrando tarjeta ${tarjeta}...`;
        fetch(`https://marquitos0925.github.io/Escaneo-tarjetas/auto_submit_qr.html?tarjeta=${tarjeta}`)
          .then(() => {
            setTimeout(() => {
              document.getElementById("status").innerText = "Esperando escaneo...";
              processing = false;
            }, 500);
          })
          .catch(() => {
            document.getElementById("status").innerText = "❌ Error al registrar.";
            processing = false;
          });
      } else {
        document.getElementById("status").innerText = "QR inválido: falta número de tarjeta.";
        processing = false;
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: 250 }, false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
