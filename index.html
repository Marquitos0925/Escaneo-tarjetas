
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escanear Tarjeta</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #status {
      margin-top: 20px;
      font-size: 1.2rem;
      color: green;
    }
  </style>
</head>
<body>
  <h1>Escanear Tarjeta</h1>
  <div id="reader"></div>
  <div id="status">Esperando escaneo...</div>

  <script>
    const SHEET_ID = "1WzJLa9I3A0vG6YrEOhSCvj-QY0gwUoOUqs8CJcv13qM";
    const API_KEY = "AIzaSyCf3Jp4GFtgMJmOQ-PAljytyhhf4emyXoM";
    const SHEET_NAME = "Lista";
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSegzTtlrBLKD8WEcANXm5-T3uPcbjWF4yMM2ArSBonW31vMXg/formResponse";
    const ENTRY_ID = "584117191";

    const statusEl = document.getElementById("status");
    let scanner;

    function registrarTarjeta(tarjeta) {
      const submitURL = `${FORM_URL}?entry.${ENTRY_ID}=${tarjeta}`;
      fetch(submitURL, { method: "POST", mode: "no-cors" })
        .then(() => {
          statusEl.innerText = `✅ Tarjeta ${tarjeta} registrada.`;
          setTimeout(() => {
            statusEl.innerText = "Esperando escaneo...";
            scanner.render(onScanSuccess);
          }, 200);
        })
        .catch(() => {
          statusEl.innerText = `❌ Error al registrar tarjeta ${tarjeta}`;
          setTimeout(() => scanner.render(onScanSuccess), 1000);
        });
    }

    function verificarYRegistrar(tarjeta) {
      const apiURL = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`;
      fetch(apiURL)
        .then(res => res.json())
        .then(data => {
          const yaEscaneadas = data.values?.slice(1).map(row => row[1]) || []; // Columna B
          if (yaEscaneadas.includes(tarjeta)) {
            statusEl.innerText = `⚠️ Tarjeta ${tarjeta} ya fue registrada.`;
            setTimeout(() => {
              statusEl.innerText = "Esperando escaneo...";
              scanner.render(onScanSuccess);
            }, 400);
          } else {
            registrarTarjeta(tarjeta);
          }
        })
        .catch(() => {
          statusEl.innerText = "❌ Error al verificar en Google Sheets.";
          setTimeout(() => scanner.render(onScanSuccess), 1000);
        });
    }

    function onScanSuccess(decodedText) {
      const params = new URLSearchParams(decodedText.split('?')[1]);
      const tarjeta = params.get("tarjeta");

      if (tarjeta) {
        statusEl.innerText = `Verificando tarjeta ${tarjeta}...`;
        scanner.clear().then(() => verificarYRegistrar(tarjeta));
      } else {
        statusEl.innerText = "❌ Código QR inválido.";
      }
    }

    scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }, false);
    scanner.render(onScanSuccess);
  </script>
</body>
</html>
